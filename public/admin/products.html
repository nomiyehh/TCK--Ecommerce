<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Taj Chicken Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="bg-gray-50">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="p-6 flex items-center space-x-3 mb-8">
            <img src="/logo.png" alt="Taj Chicken" class="h-10 object-contain brightness-0 invert">
            <span class="text-xl font-bold tracking-tight">Admin Panel</span>
        </div>
        <nav class="space-y-1">
            <a href="dashboard.html" class="nav-link">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                Dashboard
            </a>
            <a href="products.html" class="nav-link active">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                Products
            </a>
            <a href="orders.html" class="nav-link">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                Orders
            </a>
            <a href="customers.html" class="nav-link">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                Customers
            </a>
            <div class="pt-8 px-6">
                <button onclick="handleLogout()" class="w-full bg-red-600/20 text-red-500 py-2 rounded-lg font-bold hover:bg-red-600 hover:text-white transition-all flex items-center justify-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Logout
                </button>
            </div>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Product Management</h1>
                <p class="text-gray-500">Add, edit, and manage your shop products.</p>
            </div>
            <button onclick="openAddProductModal()" class="bg-red-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-red-700 transition-all flex items-center shadow-lg shadow-red-200">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Add New Product
            </button>
        </header>

        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Products will be loaded here -->
        </div>

        <!-- Add/Edit Product Modal -->
        <div id="productModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[2000] hidden">
            <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-8 shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <h2 id="modalTitle" class="text-2xl font-bold text-gray-800">Add New Product</h2>
                    <button onclick="closeProductModal()" class="text-gray-400 hover:text-gray-600">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <form id="productForm" class="space-y-6">
                    <input type="hidden" id="productId">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Product Name</label>
                            <input type="text" id="name" required class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-red-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                            <select id="category" required class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-red-500 outline-none">
                                <option value="Fresh Chicken">Fresh Chicken</option>
                                <option value="Special Cuts">Special Cuts</option>
                                <option value="Marinated">Marinated</option>
                                <option value="Eggs">Eggs</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Price per kg (₹)</label>
                            <input type="number" id="price" required class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-red-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Stock Status</label>
                            <select id="instock" class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-red-500 outline-none">
                                <option value="true">In Stock</option>
                                <option value="false">Out of Stock</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                        <textarea id="description" rows="3" class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-red-500 outline-none"></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Upload Image</label>
                            <input type="file" id="imageFile" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">OR Image URL (from Supabase Storage)</label>
                            <input type="text" id="imageUrl" placeholder="https://..." class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:ring-2 focus:ring-red-500 outline-none">
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <input type="checkbox" id="isfreshtoday" class="w-4 h-4 text-red-600 border-gray-300 rounded focus:ring-red-500">
                        <label for="isfreshtoday" class="text-sm font-medium text-gray-700">Mark as Fresh Today</label>
                    </div>
                    <div class="flex justify-end space-x-4 pt-4">
                        <button type="button" onclick="closeProductModal()" class="px-6 py-2 text-gray-600 font-medium hover:bg-gray-100 rounded-lg transition-all">Cancel</button>
                        <button type="submit" class="px-6 py-2 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700 transition-all shadow-lg shadow-red-200">Save Product</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="js/admin.js"></script>
    <script>
        let products = [];

        // Load Products
        async function loadProducts() {
            try {
                const { data, error } = await supabaseClient
                    .from('products')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                products = data || [];
                renderProducts();
            } catch (error) {
                console.error('Error loading products:', error);
                // For demo, show some mock products if table doesn't exist
                products = [
                    { id: 1, name: 'Chicken Breast', category: 'Fresh Chicken', price: 320, instock: true, image_url: 'https://picsum.photos/seed/breast/400/300', description: 'Fresh, skinless chicken breast.', isfreshtoday: true },
                    { id: 2, name: 'Whole Chicken', category: 'Fresh Chicken', price: 280, instock: true, image_url: 'https://picsum.photos/seed/whole/400/300', description: 'Fresh whole chicken with skin.', isfreshtoday: true },
                    { id: 3, name: 'Chicken Wings', category: 'Special Cuts', price: 240, instock: false, image_url: 'https://picsum.photos/seed/wings/400/300', description: 'Juicy chicken wings.', isfreshtoday: false }
                ];
                renderProducts();
            }
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 group hover:shadow-md transition-all';
                card.innerHTML = `
                    <div class="relative h-48 overflow-hidden">
                        <img src="${product.image_url || 'https://via.placeholder.com/400x300?text=No+Image'}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                        <div class="absolute top-4 right-4 flex flex-col space-y-2">
                            <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider ${product.instock ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}">
                                ${product.instock ? 'In Stock' : 'Out of Stock'}
                            </span>
                            ${product.isfreshtoday ? '<span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-yellow-500 text-white">Fresh Today</span>' : ''}
                        </div>
                    </div>
                    <div class="p-5">
                        <div class="text-xs font-bold text-red-600 uppercase tracking-widest mb-1">${product.category}</div>
                        <h3 class="text-lg font-bold text-gray-800 mb-2">${product.name}</h3>
                        <p class="text-gray-500 text-sm mb-4 line-clamp-2">${product.description || 'No description provided.'}</p>
                        <div class="flex items-center justify-between">
                            <span class="text-xl font-bold text-gray-900">₹${product.price}<span class="text-xs text-gray-400 font-normal">/kg</span></span>
                            <div class="flex space-x-2">
                                <button onclick="editProduct('${product.id}')" class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                </button>
                                <button onclick="deleteProduct('${product.id}')" class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Modal Logic
        function openAddProductModal() {
            document.getElementById('modalTitle').textContent = 'Add New Product';
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('imageUrl').value = '';
            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            document.getElementById('modalTitle').textContent = 'Edit Product';
            document.getElementById('productId').value = product.id;
            document.getElementById('name').value = product.name;
            document.getElementById('category').value = product.category;
            document.getElementById('price').value = product.price;
            document.getElementById('instock').value = product.instock.toString();
            document.getElementById('description').value = product.description || '';
            document.getElementById('isfreshtoday').checked = product.isfreshtoday || false;
            document.getElementById('imageUrl').value = product.image_url || '';
            
            document.getElementById('productModal').classList.remove('hidden');
        }

        // Form Submission
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const name = document.getElementById('name').value;
            const category = document.getElementById('category').value;
            const price = parseFloat(document.getElementById('price').value);
            const instock = document.getElementById('instock').value === 'true';
            const description = document.getElementById('description').value;
            const isfreshtoday = document.getElementById('isfreshtoday').checked;
            const imageFile = document.getElementById('imageFile').files[0];
            const manualImageUrl = document.getElementById('imageUrl').value;

            let image_url = manualImageUrl;
            if (imageFile) {
                // Upload to Supabase Storage
                const fileName = `${Date.now()}_${imageFile.name}`;
                const { data, error } = await supabaseClient.storage
                    .from('product-images')
                    .upload(fileName, imageFile);
                
                if (error) {
                    console.error('Error uploading image:', error);
                } else {
                    const { data: { publicUrl } } = supabaseClient.storage
                        .from('product-images')
                        .getPublicUrl(fileName);
                    image_url = publicUrl;
                }
            }

            const productData = {
                name,
                category,
                price,
                instock,
                description,
                isfreshtoday,
                image_url
            };

            try {
                if (id) {
                    // Update
                    const { error } = await supabaseClient
                        .from('products')
                        .update(productData)
                        .eq('id', id);
                    if (error) throw error;
                } else {
                    // Create
                    const { error } = await supabaseClient
                        .from('products')
                        .insert([productData]);
                    if (error) throw error;
                }
                
                closeProductModal();
                loadProducts();
            } catch (error) {
                console.error('Error saving product:', error);
                alert('Error saving product. Please check console for details.');
            }
        });

        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;

            try {
                const { error } = await supabaseClient
                    .from('products')
                    .delete()
                    .eq('id', id);
                
                if (error) throw error;
                loadProducts();
            } catch (error) {
                console.error('Error deleting product:', error);
                alert('Error deleting product.');
            }
        }

        loadProducts();
    </script>
</body>
</html>
